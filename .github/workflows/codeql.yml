name: CodeQL

# ─────────────────────────────────────────────────────────────────────────────
#  Static analysis (REPO-BASELINE.md §1). The page renders text that comes from a third
#  party (OSV advisory summaries) and from the visitor's own file, which is exactly the
#  DOM-injection surface CodeQL's JavaScript queries cover; the workflows push commits
#  and open pull requests, which the Actions queries cover.
#
#  No build step: plain ES modules. Public repository, so code scanning is available
#  without Advanced Security.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
