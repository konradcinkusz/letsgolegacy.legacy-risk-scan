name: Secret Scan

# ─────────────────────────────────────────────────────────────────────────────
#  The CI half of a two-part control (P5, REPO-BASELINE.md §2): the pre-commit hook
#  (scripts/hooks/pre-commit) catches a secret before it becomes history; this job
#  catches contributors without the hook, over the FULL history, on every PR and push.
#
#  The scanner image is :latest on purpose: a detection ruleset is only worth what its
#  newest rule catches. The weekly run re-scans history against rules added since.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v7
        with:
          # Load-bearing: a shallow clone would scan only the tip, and a secret added and
          # removed within the branch would pass while remaining in history.
          fetch-depth: 0

      - name: Scan
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:latest \
            git /repo --config=/repo/.gitleaks.toml --redact --no-banner --verbose --exit-code 1

      - name: Explain a failure
        if: failure()
        run: |
          {
            echo "## Secret scan failed"
            echo
            echo "**This repository is public.** A pushed commit is disclosed the moment it is pushed:"
            echo
            echo "1. **Rotate the credential** — before anything else."
            echo "2. Remove it from the source."
            echo "3. Only then clean history."
            echo
            echo "A false positive gets a narrow, commented allowlist entry in \`.gitleaks.toml\`."
            echo "Reproduce locally: \`./scripts/scan-secrets.sh\`"
          } >> "$GITHUB_STEP_SUMMARY"
